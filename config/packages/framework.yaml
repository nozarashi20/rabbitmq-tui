# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  secret: '%env(APP_SECRET)%'

  http_client:
    scoped_clients:
      rabbitmq.management:
        base_uri: '%env(RABBITMQ_MANAGEMENT_URL)%'
        auth_basic: '%env(RABBITMQ_MANAGEMENT_USERNAME)%:%env(RABBITMQ_MANAGEMENT_PASSWORD)%'
        headers:
          Accept: application/json
        timeout: 5

  # Note that the session will be started ONLY if you read or write from it.
  session: true

  #esi: true
  #fragments: true

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
